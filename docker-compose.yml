services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shortcut
      POSTGRES_USER: shortcut
      POSTGRES_PASSWORD: shortcut
    ports:
      - "5432:5432"
    volumes:
      - shortcut-postgres:/var/lib/postgresql/data
      - ./backend/database:/docker-entrypoint-initdb.d:ro

volumes:
  shortcut-postgres:
